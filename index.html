<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yapılacaklar</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #8a8a8a;
    --line: #ececec;
    --field: #f5f5f5;
    --accent: #1a1a1a;
    --accent-fg: #ffffff;
    --danger: #d33;
  }
  @supports (color: AccentColor) {
    :root { --accent: AccentColor; --accent-fg: AccentColorText; }
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #ececec;
      --muted: #7a7a7a;
      --line: #262626;
      --field: #1c1c1c;
      --danger: #ff6b6b;
    }
    @supports not (color: AccentColor) {
      :root { --accent: #ececec; --accent-fg: #121212; }
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--fg);
    display: flex;
    justify-content: center;
    padding: 56px 32px;
  }
  .app { width: 100%; max-width: 1200px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 32px; }
  #sutunlar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
  @media (max-width: 800px) { #sutunlar { grid-template-columns: 1fr; } header { flex-direction: column; } }
  section { min-width: 0; }
  h2 { margin: 0 0 14px; font-size: 16px; font-weight: 600; }
  h2 span { color: var(--muted); font-weight: 400; }
  .hata { color: var(--danger); font-size: 14px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
  form { display: flex; gap: 8px; margin-bottom: 8px; }
  form input {
    min-width: 0;
    flex: 1;
    padding: 10px 12px;
    font: inherit;
    color: inherit;
    background: var(--field);
    border: 1px solid transparent;
    border-radius: 6px;
    outline: none;
  }
  form input:focus { border-color: var(--accent); background: var(--bg); }
  button { cursor: pointer; border: none; background: none; font: inherit; color: inherit; }
  .ekle {
    background: var(--accent);
    color: var(--accent-fg);
    padding: 0 16px;
    border-radius: 6px;
    font-size: 14px;
  }
  .ekle:hover { opacity: .85; }
  .filtreler { display: flex; gap: 16px; font-size: 14px; }
  .filtreler button { color: var(--muted); padding: 2px 0; border-bottom: 1px solid transparent; }
  .filtreler button:hover { color: var(--fg); }
  .filtreler button.aktif { color: var(--fg); border-bottom-color: var(--fg); }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  li input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); margin: 0; }
  li .metin { flex: 1; font-size: 15px; word-break: break-word; cursor: text; }
  li.bitti .metin { text-decoration: line-through; color: var(--muted); }
  li .duzenle {
    flex: 1; font: inherit; font-size: 15px; color: inherit;
    padding: 2px 6px; margin: -3px 0;
    background: var(--field); border: 1px solid var(--accent); border-radius: 4px; outline: none;
  }
  li .sil { color: var(--muted); font-size: 18px; line-height: 1; padding: 0 4px; opacity: 0; transition: opacity .15s; }
  li .sil:hover { color: var(--danger); }
  li:hover .sil { opacity: 1; }
  .alt {
    display: flex;
    justify-content: space-between;
    margin-top: 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .alt button { color: var(--muted); }
  .alt button:hover { color: var(--fg); }
  .bos { text-align: center; color: var(--muted); padding: 32px 0; font-size: 14px; }
  .ipucu { font-size: 12px; color: var(--muted); margin-top: 40px; text-align: center; opacity: .7; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Yapılacaklar</h1>
    <div class="filtreler">
      <button data-f="hepsi" class="aktif">Hepsi</button>
      <button data-f="aktif">Aktif</button>
      <button data-f="bitti">Tamamlanan</button>
    </div>
  </header>
  <div id="hata" class="hata" hidden></div>
  <main id="sutunlar"></main>
  <div class="ipucu">Düzenlemek için göreve çift tıkla</div>
</div>

<script>
  // Supabase bağlantısı (publishable anahtar tarayıcıda kullanılmak içindir)
  const SUPABASE_URL = "https://phipqnqnuntcoawnorqj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_lD7YDH7PRRz1WKO6wdx1uQ_effusaoB";
  const API = SUPABASE_URL + "/rest/v1/todos";
  const KISILER = ["Ziya", "Emir", "Mehmet"];

  let gorevler = [];
  let filtre = "hepsi";
  let yukleniyor = true;
  let duzenleniyor = false;
  const sutun = {}; // kişi -> { liste, sayac }

  async function istek(yol, secenek = {}) {
    const cevap = await fetch(API + yol, {
      ...secenek,
      headers: {
        apikey: SUPABASE_KEY,
        "Content-Type": "application/json",
        Prefer: "return=representation",
        ...(secenek.headers || {})
      }
    });
    if (!cevap.ok) throw new Error(cevap.status + " " + (await cevap.text()));
    return cevap.status === 204 ? null : cevap.json();
  }

  function hataGoster(mesaj) {
    const h = document.getElementById("hata");
    h.textContent = mesaj;
    h.hidden = !mesaj;
  }

  async function calistir(is) {
    try {
      await is();
      hataGoster("");
    } catch (e) {
      hataGoster("Supabase hatası: " + e.message);
      console.error(e);
    }
    ciz();
  }

  async function yukle() {
    await calistir(async () => {
      gorevler = await istek("?select=*&order=created_at.asc");
    });
    yukleniyor = false;
    ciz();
  }

  const ekle = (kisi, metin) => calistir(async () => {
    const [yeni] = await istek("", { method: "POST", body: JSON.stringify({ kisi, metin }) });
    gorevler.push(yeni);
  });

  const guncelle = (g, alanlar) => calistir(async () => {
    const [yeni] = await istek("?id=eq." + g.id, { method: "PATCH", body: JSON.stringify(alanlar) });
    Object.assign(g, yeni);
  });

  const sil = ids => ids.length && calistir(async () => {
    await istek("?id=in.(" + ids.join(",") + ")", { method: "DELETE" });
    gorevler = gorevler.filter(g => !ids.includes(g.id));
  });

  // Sütunları bir kez kur; sonraki çizimlerde sadece listeler yenilenir
  KISILER.forEach(kisi => {
    const bolum = document.createElement("section");
    bolum.innerHTML = `
      <h2>${kisi} <span>yapılacak</span></h2>
      <form><input type="text" placeholder="Yeni görev..." autocomplete="off"><button class="ekle" type="submit">Ekle</button></form>
      <ul></ul>
      <div class="alt"><span class="sayac"></span><button class="temizle">Tamamlananları sil</button></div>`;
    const giris = bolum.querySelector("input");
    bolum.querySelector("form").onsubmit = e => {
      e.preventDefault();
      const metin = giris.value.trim();
      if (!metin) return;
      giris.value = "";
      ekle(kisi, metin);
    };
    bolum.querySelector(".temizle").onclick = () =>
      sil(gorevler.filter(g => g.kisi === kisi && g.bitti).map(g => g.id));
    sutun[kisi] = { liste: bolum.querySelector("ul"), sayac: bolum.querySelector(".sayac") };
    document.getElementById("sutunlar").appendChild(bolum);
  });

  function ciz() {
    duzenleniyor = false;
    KISILER.forEach(kisi => {
      const { liste, sayac } = sutun[kisi];
      liste.innerHTML = "";
      if (yukleniyor) {
        liste.innerHTML = '<div class="bos">Yükleniyor...</div>';
        return;
      }
      const kendi = gorevler.filter(g => g.kisi === kisi);
      const gorunen = kendi.filter(g =>
        filtre === "hepsi" ? true : filtre === "aktif" ? !g.bitti : g.bitti
      );
      if (gorunen.length === 0) liste.innerHTML = '<div class="bos">Görev yok</div>';

      gorunen.forEach(g => {
        const li = document.createElement("li");
        if (g.bitti) li.classList.add("bitti");

        const kutu = document.createElement("input");
        kutu.type = "checkbox";
        kutu.checked = g.bitti;
        kutu.onchange = () => guncelle(g, { bitti: kutu.checked });

        const metin = document.createElement("span");
        metin.className = "metin";
        metin.textContent = g.metin;
        metin.ondblclick = () => duzenle(li, metin, g);

        const silBtn = document.createElement("button");
        silBtn.className = "sil";
        silBtn.textContent = "×";
        silBtn.title = "Sil";
        silBtn.onclick = () => sil([g.id]);

        li.append(kutu, metin, silBtn);
        liste.appendChild(li);
      });

      sayac.textContent = kendi.filter(g => !g.bitti).length + " görev kaldı";
    });
  }

  function duzenle(li, metin, g) {
    duzenleniyor = true;
    const inp = document.createElement("input");
    inp.className = "duzenle";
    inp.value = g.metin;
    li.replaceChild(inp, metin);
    inp.focus();
    inp.select();

    let bitti = false;
    const bitir = (kaydetsin) => {
      if (bitti) return;
      bitti = true;
      const yeni = inp.value.trim();
      if (!kaydetsin || yeni === g.metin) return ciz();
      if (yeni) guncelle(g, { metin: yeni });
      else sil([g.id]);
    };
    inp.onkeydown = e => {
      if (e.key === "Enter") bitir(true);
      if (e.key === "Escape") bitir(false);
    };
    inp.onblur = () => bitir(true);
  }

  document.querySelectorAll(".filtreler button").forEach(b => {
    b.onclick = () => {
      filtre = b.dataset.f;
      document.querySelectorAll(".filtreler button").forEach(x => x.classList.remove("aktif"));
      b.classList.add("aktif");
      ciz();
    };
  });

  // Diğerlerinin değişikliklerini görmek için: sekmeye dönünce ve 20 saniyede bir yenile
  const yenile = () => { if (!duzenleniyor && !document.hidden) yukle(); };
  window.addEventListener("focus", yenile);
  setInterval(yenile, 20000);

  ciz();
  yukle();
</script>
</body>
</html>
